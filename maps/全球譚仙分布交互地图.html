<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>🗺️ 全球譚仙分布交互地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --paper:#f8f5f0;          /* 米白 */
  --paper-2:#fffdf9;
  --ink:#1f3831;            /* 墨綠（正文） */
  --ink-2:#4a5a55;          /* 次要文字 */
  --ink-3:#8a9490;          /* 弱化文字 */
  --green:#0e7a5f;          /* 澳門綠 */
  --green-soft:rgba(14,122,95,.12);
  --gold:#c8a24e;           /* 思辨金 */
  --gold-soft:rgba(200,162,78,.16);
  --line:rgba(14,122,95,.22);
  --line-g:rgba(200,162,78,.35);
  --panel:rgba(248,245,240,.96);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
 background:#eeeae2;color:var(--ink)}
#map{width:100%;height:100%;background:#eeeae2}
.leaflet-container{background:#eeeae2;font-family:inherit}
.leaflet-tile-pane{transition:filter .45s ease}

/* ============ 頂欄 ============ */
#header{position:fixed;top:0;left:0;right:0;z-index:9999;
 background:linear-gradient(180deg,rgba(248,245,240,.98),rgba(248,245,240,.92));
 border-bottom:1px solid var(--line-g);padding:9px 16px 8px;
 padding-top:calc(9px + env(safe-area-inset-top));backdrop-filter:blur(14px);
 box-shadow:0 2px 16px rgba(31,56,49,.10)}
#header h1{font-size:18px;font-weight:800;color:var(--green);text-align:center;letter-spacing:1px}
#header h1 small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;letter-spacing:.4px;margin-top:2px}
.hrow{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:7px;flex-wrap:wrap}
#progress-text{font-size:13px;color:var(--gold);font-weight:800;font-family:ui-monospace,monospace;min-width:76px;text-align:center}
#progress-track{width:180px;height:7px;background:rgba(31,56,49,.12);border-radius:4px;overflow:hidden}
#progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold));
 border-radius:4px;transition:width .45s cubic-bezier(.4,0,.2,1)}
#header-btns{display:flex;gap:6px;justify-content:center;margin-top:7px;flex-wrap:wrap}
.h-btn{font-size:12.5px;padding:7px 13px;border-radius:13px;border:1px solid var(--line-g);
 background:var(--gold-soft);color:#8a6d2a;cursor:pointer;transition:.18s;white-space:nowrap;font-weight:600}
.h-btn:hover{background:rgba(200,162,78,.26);border-color:var(--gold)}
.h-btn:active{transform:scale(.95)}
.h-btn.on{background:rgba(14,122,95,.16);border-color:var(--green);color:var(--green)}

/* ============ 圖例 ============ */
#legend-toggle{position:fixed;right:12px;z-index:9998;top:calc(150px + env(safe-area-inset-top));
 width:44px;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line-g);
 display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;
 backdrop-filter:blur(10px);box-shadow:0 3px 14px rgba(31,56,49,.18)}
#legend{position:fixed;right:12px;z-index:9998;top:calc(202px + env(safe-area-inset-top));
 width:218px;background:var(--panel);border:1px solid var(--line-g);
 border-radius:12px;backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(31,56,49,.22);
 display:none;max-height:calc(100vh - 320px);overflow-y:auto;padding:10px 12px}
#legend.show{display:block;animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.legend-title{font-size:11.5px;color:var(--green);font-weight:800;letter-spacing:1.5px;margin:8px 0 5px;
 padding-bottom:4px;border-bottom:1px solid var(--line)}
.legend-title:first-child{margin-top:0}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);
 padding:4px 5px;border-radius:7px;cursor:pointer;transition:.15s;user-select:none}
.legend-item:hover{background:var(--green-soft)}
.legend-item.off{opacity:.32}
.legend-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;
 border:2px solid #fff;box-shadow:0 1px 4px rgba(31,56,49,.35)}
.legend-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend-n{font-size:11px;color:var(--ink-3);font-family:ui-monospace,monospace}
.legend-note{font-size:11px;color:var(--ink-3);line-height:1.55;margin-top:7px;padding-top:6px;
 border-top:1px solid var(--line)}
.legend-item.legend-static{cursor:default}
.legend-item.legend-static:hover{background:transparent}
.ring-demo{width:13px;height:13px;border-radius:50%;flex-shrink:0;box-sizing:border-box;
 background:rgba(31,56,49,.22)}
.ring-demo.t1{border:2px solid var(--gold);box-shadow:0 0 5px rgba(200,162,78,.7)}
.ring-demo.t2{border:1.6px solid var(--green)}
.ring-demo.t3{border:1.3px dashed rgba(31,56,49,.55)}

/* ============ 時間軸 ============ */
#time-panel{position:fixed;bottom:0;left:0;right:0;z-index:9999;background:var(--panel);
 border-top:1px solid var(--line-g);padding:9px 16px 11px;
 padding-bottom:calc(11px + env(safe-area-inset-bottom));backdrop-filter:blur(14px);
 box-shadow:0 -2px 16px rgba(31,56,49,.10)}
#time-panel .lab{font-size:12px;color:var(--green);font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
#time-panel .lab em{font-style:normal;color:var(--ink-3);font-weight:400;font-size:11.5px}
.range-row{display:flex;align-items:center;gap:10px}
input[type=range]{flex:1;accent-color:var(--green);height:26px;-webkit-appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:rgba(31,56,49,.16);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
 background:var(--gold);border:2px solid var(--green);margin-top:-8.5px;box-shadow:0 0 10px rgba(200,162,78,.5)}
#year-display{font-size:16px;color:#8a6d2a;font-weight:800;min-width:58px;text-align:center;
 font-family:ui-monospace,monospace;background:var(--gold-soft);padding:3px 9px;border-radius:6px;
 border:1px solid var(--line-g)}
#visible-count{font-size:11.5px;color:var(--ink-3);margin-top:5px;text-align:center}
#visible-count b{color:var(--green);font-weight:800}
.mini-btn{font-size:11px;padding:4px 9px;border-radius:9px;border:1px solid var(--line-g);
 background:var(--gold-soft);color:#8a6d2a;cursor:pointer;white-space:nowrap;font-weight:600}
.mini-btn.on{background:rgba(14,122,95,.16);border-color:var(--green);color:var(--green)}

/* ============ 彈窗（米白卡片） ============ */
.leaflet-popup-content-wrapper{background:linear-gradient(168deg,var(--paper-2) 0%,var(--paper) 100%);
 color:var(--ink);border-radius:14px;border:1px solid var(--line-g);
 box-shadow:0 12px 38px rgba(31,56,49,.28);overflow:hidden}
.leaflet-popup-tip{background:var(--paper);border:1px solid var(--line-g)}
.leaflet-popup-content{margin:0 !important;width:320px !important;line-height:1.6}
.leaflet-popup-close-button{color:var(--ink-3) !important;font-size:20px !important;
 right:8px !important;top:6px !important;width:26px !important;height:26px !important}
.leaflet-popup-close-button:hover{color:var(--green) !important;background:transparent !important}
.p-head{padding:11px 14px 10px;background:linear-gradient(120deg,rgba(200,162,78,.16),rgba(14,122,95,.12));
 border-bottom:1px solid var(--line-g)}
.p-badges{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:5px}
.p-badge{font-size:10.5px;padding:2px 7px;border-radius:7px;letter-spacing:.5px;font-weight:700}
.badge-kind{background:var(--gold-soft);color:#8a6d2a;border:1px solid var(--line-g)}
.badge-chain{background:rgba(14,122,95,.14);color:var(--green);border:1px solid rgba(14,122,95,.4)}
.badge-flag{background:rgba(185,28,28,.10);color:#b91c1c;border:1px solid rgba(185,28,28,.32)}
.badge-flag.ok{background:rgba(37,99,235,.10);color:#1d4ed8;border-color:rgba(37,99,235,.32)}
.badge-rank{font-size:10.5px;color:var(--ink-3);font-family:ui-monospace,monospace;margin-left:auto}
.badge-lv1{background:linear-gradient(120deg,rgba(200,162,78,.28),rgba(200,162,78,.14));
 color:#7a5f16;border:1px solid var(--gold);font-weight:800}
.badge-lv2{background:rgba(14,122,95,.14);color:var(--green);border:1px solid rgba(14,122,95,.42)}
.badge-lv3{background:rgba(31,56,49,.08);color:var(--ink-2);border:1px dashed rgba(31,56,49,.45)}
.p-name{font-size:17px;font-weight:800;color:var(--ink);line-height:1.35;letter-spacing:.3px}
.p-place{font-size:12px;color:var(--ink-2);margin-top:3px;display:flex;align-items:center;gap:5px}
.p-place i{width:8px;height:8px;border-radius:50%;display:inline-block;font-style:normal;
 border:1.5px solid #fff;box-shadow:0 1px 3px rgba(31,56,49,.35)}
.p-year{display:flex;align-items:baseline;gap:8px;padding:9px 14px 8px;background:rgba(200,162,78,.09);
 border-bottom:1px solid var(--line-g)}
.p-year b{font-size:23px;color:#8a6d2a;font-family:ui-monospace,monospace;font-weight:800;letter-spacing:-.5px}
.p-year span{font-size:11.5px;color:var(--ink-2);line-height:1.45}
.p-body{padding:10px 14px 12px}
.p-tl{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
.tl-cell{background:rgba(31,56,49,.045);border:1px solid rgba(31,56,49,.1);
 border-radius:8px;padding:6px 8px}
.tl-k{font-size:10px;color:var(--ink-3);letter-spacing:.5px;margin-bottom:2px}
.tl-v{font-size:11.5px;color:var(--ink);line-height:1.45;word-break:break-word}
.p-row{display:flex;gap:7px;font-size:11.5px;margin-bottom:5px;align-items:flex-start}
.p-row .k{color:var(--ink-3);flex-shrink:0;width:52px}
.p-row .v{color:var(--ink);flex:1;word-break:break-word}
.p-row .v.gold{color:#8a6d2a;font-weight:700}
.p-warn{margin-top:8px;background:rgba(200,162,78,.12);border-left:3px solid var(--gold);
 border-radius:0 8px 8px 0;padding:7px 10px;font-size:11.5px;color:#6b551d;line-height:1.6}
.p-warn b{color:#8a6d2a;font-weight:800}
.p-foot{margin-top:8px;padding-top:7px;border-top:1px solid rgba(31,56,49,.12);
 display:flex;justify-content:space-between;align-items:center;gap:8px}
.p-src{font-size:10.5px;color:var(--ink-3);font-style:italic;flex:1}
.p-lit{font-size:11.5px;padding:4px 10px;border-radius:9px;cursor:pointer;white-space:nowrap;
 border:1px solid var(--line-g);background:var(--gold-soft);color:#8a6d2a;font-weight:700;transition:.16s}
.p-lit:hover{background:rgba(200,162,78,.28)}
.p-lit.on{background:rgba(236,72,153,.14);border-color:#ec4899;color:#be185d}

/* ============ 名錄面板 ============ */
#list-panel{position:fixed;left:0;top:0;bottom:0;width:348px;z-index:10000;
 background:rgba(248,245,240,.975);border-right:1px solid var(--line-g);
 backdrop-filter:blur(16px);transform:translateX(-105%);transition:transform .32s cubic-bezier(.4,0,.2,1);
 display:flex;flex-direction:column;box-shadow:8px 0 30px rgba(31,56,49,.18)}
#list-panel.show{transform:none}
#list-head{padding:14px 16px 10px;padding-top:calc(14px + env(safe-area-inset-top));
 border-bottom:1px solid var(--line)}
#list-head h2{font-size:16px;color:var(--green);font-weight:800;display:flex;align-items:center;gap:8px}
#list-head h2 span{font-size:11.5px;color:var(--ink-3);font-weight:400}
#list-search{width:100%;margin-top:9px;padding:7px 11px;border-radius:9px;font-size:12.5px;
 background:rgba(31,56,49,.05);border:1px solid var(--line-g);color:var(--ink);outline:none;font-family:inherit}
#list-search:focus{border-color:var(--green);background:#fff}
#list-search::placeholder{color:var(--ink-3)}

/* 大區快速跳轉滑條 */
#list-strip{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;overflow-y:hidden;
 border-bottom:1px solid var(--line);background:rgba(31,56,49,.03);
 cursor:grab;scrollbar-width:none;flex-shrink:0}
#list-strip.dragging{cursor:grabbing}
#list-strip::-webkit-scrollbar{display:none}
.strip-chip{display:flex;align-items:center;gap:5px;flex-shrink:0;padding:5px 10px;border-radius:11px;
 font-size:12px;white-space:nowrap;user-select:none;cursor:pointer;transition:.16s;color:var(--ink-2);
 background:rgba(31,56,49,.05);border:1px solid rgba(14,122,95,.24)}
.strip-chip:hover{background:rgba(200,162,78,.2)}
.strip-chip i{width:9px;height:9px;border-radius:50%;font-style:normal;flex-shrink:0;
 border:1.5px solid #fff;box-shadow:0 1px 3px rgba(31,56,49,.35)}
.strip-chip b{font-size:10.5px;color:var(--ink-3);font-family:ui-monospace,monospace;font-weight:700}
.strip-chip.active{background:var(--gold-soft);border-color:var(--gold);color:var(--ink);
 box-shadow:0 0 0 1px rgba(200,162,78,.35) inset;font-weight:700}
.strip-chip.active b{color:#8a6d2a}
.strip-chip.empty{opacity:.35;cursor:default}
.strip-chip.empty:hover{background:rgba(31,56,49,.05)}

#list-body{flex:1;overflow-y:auto;padding:6px 8px 24px}
.lg-group{margin-top:6px;scroll-margin-top:4px}
.lg-title{font-size:11.5px;color:var(--green);font-weight:800;letter-spacing:1px;padding:8px 8px 6px;
 display:flex;align-items:center;gap:7px;position:sticky;top:0;background:rgba(248,245,240,.985);z-index:2;
 border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.lg-title i{width:9px;height:9px;border-radius:50%;font-style:normal;
 border:1.5px solid #fff;box-shadow:0 1px 3px rgba(31,56,49,.35)}
.lg-title .c{font-size:10.5px;color:var(--ink-3);font-family:ui-monospace,monospace;font-weight:700}
.lg-title .ar{font-size:9px;color:var(--ink-3);margin-left:auto;transition:transform .2s}
.lg-group.collapsed .ar{transform:rotate(-90deg)}
.lg-group.collapsed .lg-items{display:none}
.lg-item{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:8px;cursor:pointer;transition:.15s}
.lg-item:hover{background:var(--green-soft)}
.lg-item.lit{background:rgba(236,72,153,.1)}
.lg-item.lit .lg-n{color:#be185d;font-weight:700}
.lg-y{font-size:11px;color:#8a6d2a;font-family:ui-monospace,monospace;width:48px;flex-shrink:0;
 text-align:right;padding-top:1px;font-weight:600}
.lg-main{flex:1;min-width:0}
.lg-n{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.45}
.lg-p{font-size:10.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.lg-t{font-size:10px;color:var(--green);border:1px solid rgba(14,122,95,.35);border-radius:6px;
 padding:0 4px;flex-shrink:0;margin-top:2px;background:rgba(14,122,95,.07)}
.lg-item.unknown .lg-t{border-color:rgba(185,28,28,.35);color:#b91c1c;background:rgba(185,28,28,.07)}
.lg-star{font-size:10px;flex-shrink:0;margin-top:2px;line-height:1}
.lg-star.t1{color:var(--gold);text-shadow:0 0 4px rgba(200,162,78,.55)}
.lg-star.t2{color:var(--green)}
#list-close{position:absolute;right:10px;top:calc(12px + env(safe-area-inset-top));
 width:32px;height:32px;border-radius:9px;background:rgba(31,56,49,.06);border:1px solid var(--line-g);
 color:var(--green);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ============ 點位：默認圓點 · 點亮蓮花 ============ */
/* --pt-size / --pt-halo 由 JS 依縮放等級動態寫入 */
:root{--pt-size:11px;--pt-halo:.20;--pt-lotus:34px}
.lotus-icon{background:transparent !important;border:none !important}
.pt-wrap{width:44px;height:44px;display:flex;align-items:center;justify-content:center;
 position:relative;cursor:pointer}
/* 地區色柔光暈：暗灰路網上把圓點從背景里托起來 */
.pt-halo{position:absolute;top:50%;left:50%;width:calc(var(--pt-size) + 14px);
 height:calc(var(--pt-size) + 14px);margin:0;transform:translate(-50%,-50%);border-radius:50%;
 opacity:var(--pt-halo);pointer-events:none;transition:opacity .3s ease,width .3s ease,height .3s ease}
.pt-dot{position:relative;width:var(--pt-size);height:var(--pt-size);border-radius:50%;
 border:2px solid #fff;box-shadow:0 1px 5px rgba(31,56,49,.55);
 transition:width .3s cubic-bezier(.4,0,.2,1),height .3s cubic-bezier(.4,0,.2,1),transform .2s cubic-bezier(.34,1.4,.64,1)}
.pt-wrap:hover .pt-dot{transform:scale(1.5)}
.pt-wrap:hover .pt-halo{opacity:calc(var(--pt-halo) + .22)}

.pt-lotus{display:none;width:var(--pt-lotus);height:var(--pt-lotus)}
.pt-lotus svg{width:100%;height:100%;filter:drop-shadow(0 2px 5px rgba(31,56,49,.35))}
.pt-wrap.lit .pt-dot,.pt-wrap.lit .pt-halo{display:none}
.pt-wrap.lit .pt-lotus{display:block;animation:lotusPop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes lotusPop{0%{transform:scale(.25) rotate(-12deg);opacity:0}
 55%{transform:scale(1.18) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
/* 點亮態光暈：粉金雙層，隨蓮花呼吸 */
.pt-wrap.lit .pt-lotus svg{animation:lotusBreathe 2.8s ease-in-out infinite .55s}
.pt-wrap.lit .pt-lotus{filter:drop-shadow(0 0 9px rgba(236,72,153,.85))
 drop-shadow(0 0 20px rgba(200,162,78,.55))}
@keyframes lotusBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
/* 點亮後的金色脈衝光環 */
.pt-wrap.lit::after{content:'';position:absolute;top:50%;left:50%;
 width:var(--pt-lotus);height:var(--pt-lotus);margin:calc(var(--pt-lotus) / -2) 0 0 calc(var(--pt-lotus) / -2);
 border-radius:50%;border:1.5px solid var(--gold);pointer-events:none;
 animation:litHalo 2.8s ease-out infinite}
@keyframes litHalo{0%{transform:scale(.55);opacity:.85}
 70%{transform:scale(1.9);opacity:0}100%{transform:scale(1.9);opacity:0}}
.pt-wrap .pt-no{position:absolute;top:-2px;left:50%;transform:translateX(-50%);
 font-size:9px;font-family:ui-monospace,monospace;background:var(--panel);color:#8a6d2a;
 border:1px solid var(--line-g);border-radius:6px;padding:0 3px;opacity:0;transition:.2s;white-space:nowrap}
.pt-wrap:hover .pt-no{opacity:1}
/* 法定等級外環：金=世遺／國保，綠=國定古蹟／國家遺產，虛灰=地方級 */
.pt-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
 border-radius:50%;pointer-events:none;box-sizing:border-box;background:transparent;
 transition:width .3s ease,height .3s ease}
.pt-ring.t1{width:calc(var(--pt-size) + 9px);height:calc(var(--pt-size) + 9px);
 border:2px solid var(--gold);box-shadow:0 0 6px rgba(200,162,78,.8),inset 0 0 3px rgba(200,162,78,.45)}
.pt-ring.t2{width:calc(var(--pt-size) + 7px);height:calc(var(--pt-size) + 7px);
 border:1.6px solid var(--green);box-shadow:0 0 4px rgba(14,122,95,.45)}
.pt-ring.t3{width:calc(var(--pt-size) + 6px);height:calc(var(--pt-size) + 6px);
 border:1.3px dashed rgba(31,56,49,.5)}
.pt-wrap.lit .pt-ring{display:none}

/* ============ 點亮特效 ============ */
.bloom{position:fixed;pointer-events:none;z-index:200;width:80px;height:80px;margin:-40px 0 0 -40px}
.bloom .bl{position:absolute;top:50%;left:50%;animation:rise 1.5s cubic-bezier(.22,1,.36,1) forwards}
.bl svg{width:52px;height:52px;filter:drop-shadow(0 0 14px rgba(236,72,153,.85))}
@keyframes rise{0%{transform:translate(-50%,-50%) scale(.2) rotate(-8deg);opacity:0}
 22%{transform:translate(-50%,-62%) scale(1.12) rotate(3deg);opacity:1}
 100%{transform:translate(-50%,-135%) scale(1.55) rotate(6deg);opacity:0}}
.bloom .rp{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;

/* 次級條目（候補／存疑／資料不足）在全球視野下抽稀，避免密集區糊成一團；

function isSecondary(p){ return p.flag==='候補'||p.flag==='存疑'||p.flag==='資料不足'; }
var secondManual=null;

  clearSpider();

    if(!map.hasLayer(markers[p.idx])) return;
    var c=map.latLngToContainerPoint([p.lat,p.lon]);

    if(cl.length<2) return;

function stopSeq(finished){

    document.getElementById('sb-hint').textContent='共 '+seqList.length+' 座 · 點擊關閉';
    setTimeout(function(){
      bn.classList.remove('show'); bn.classList.remove('done');

/* 點位旁的浮標：名稱 + 年代 + 地區 */
function flyLabel(p){
  var m=markers[p.idx];
  if(!map.hasLayer(m)) return;
  function put(){
    if(!map.hasLayer(m)) return;
    var pt=map.latLngToContainerPoint(m.getLatLng());
    var d=document.createElement('div');
    d.className='seq-label';
    d.innerHTML='<span class="sy">'+((p.y===null)?'年代不詳':p.y)+'</span>'
      +'<span class="sn">'+esc(p.name)+'</span>'
      +'<span class="sk">'+esc(p.kind)+'</span>'
      +'<span class="sa">'+esc(p.area)+'</span>';
    d.style.left=pt.x+'px'; d.style.top=pt.y+'px';
    map.getContainer().appendChild(d);
    setTimeout(function(){ d.classList.add('out'); },1250);
    setTimeout(function(){ if(d.parentNode) d.remove(); },1900);
  }
  /* 只在點位處於視口內時彈標籤，避免逐點平移導致畫面抖動；
     視口外的點位由底部橫幅統一顯示名稱與年代 */
  var b=map.getBounds().pad(-0.12);
  if(b.contains(L.latLng(p.lat,p.lon))) put();
}
function seqStep(){
  if(seqIdx>=seqList.length){ stopSeq(true); syncList(); return; }
  var p=seqList[seqIdx];
  /* 時間軸聯動：先把年份推到當前廟宇年代，再落地圖可見性，
     這樣點位是「隨年代逐一浮現 + 逐一綻放」，而不是一開始就全在圖上了 */
  if(seqLinkYear && p.y!==null && p.y!==year){
    year = p.y;
    slider.value = year;
    document.getElementById('year-display').textContent = year;
    refresh();
  }
  lit[p.idx]=true;
  setLitDom(p.idx, true);
  var m=markers[p.idx];
  if(map.hasLayer(m)){
    var pt=map.latLngToContainerPoint(m.getLatLng());
    var r=map.getContainer().getBoundingClientRect();
    bloom(pt.x+r.left, pt.y+r.top);
  }
  chime(true);
  flyLabel(p);
  seqIdx++;
  /* 時間軸聯動：滑塊與年份顯示跟着當前點亮廟宇的年代走 */
  if(seqLinkYear && p.y!==null && p.y!==year){
    year = p.y;
    slider.value = year;
    document.getElementById('year-display').textContent = year;
  }
  var bn=document.getElementById('seq-banner');
  document.getElementById('sb-n').textContent = seqIdx+' / '+seqList.length;
  document.getElementById('sb-y').textContent = (p.y===null)? '年代不詳' : p.y;
  document.getElementById('sb-name').textContent = p.name;
  document.getElementById('sb-a').textContent = p.area+' · '+p.place;
  document.getElementById('sb-fill').style.width = (seqIdx/seqList.length*100)+'%';
  var lc=Object.keys(lit).length;
  document.getElementById('progress-text').textContent = lc+' / '+POINTS.length;
  document.getElementById('progress-fill').style.width = (lc/POINTS.length*100)+'%';
  document.getElementById('visible-count').innerHTML = '顯示 <b>'+visN+'</b> / '+POINTS.length+' 座廟宇 · 已點亮 <b>'+lc+'</b> 座';
  if(document.getElementById('list-panel').classList.contains('show')) updateItem(p.idx);
}
function lightAll(){
  if(seqTimer){ stopSeq(false); return; }   /* 播放中再點一次即停止 */
  lit={}; refresh();
  /* 關鍵：先按「當前篩選」取出完整序列，再把年份回捲到最早年代，
     否則序列會被回捲後的年份條件截斷成只剩頭幾座 */
  seqList = POINTS.filter(visible).slice().sort(function(a,b){
    var ya=(a.y===null? 9999:a.y), yb=(b.y===null? 9999:b.y);
    return ya-yb || a.idx-b.idx;
  });
  if(!seqList.length){ refresh(); return; }
  seqStartYear = year;
  seqLinkYear = true;
  var ymin = null;
  seqList.forEach(function(p){ if(p.y!==null && (ymin===null || p.y<ymin)) ymin=p.y; });
  if(ymin!==null){
    year = ymin; slider.value = year;
    document.getElementById('year-display').textContent = year;
    refresh();
  }
  seqIdx=0;
  var bn=document.getElementById('seq-banner');
  bn.classList.remove('done'); bn.classList.add('show');
  document.getElementById('sb-fill').style.width='0%';
  document.getElementById('sb-hint').textContent='每 0.3 秒點亮一座 · 時間軸同步推進 · 點擊此處停止';
  seqBtns(true);
  seqStep();
  seqTimer=setInterval(seqStep,STEP);
}

function bloom(x,y){
  var d=document.createElement('div'); d.className='bloom';
  d.style.left=x+'px'; d.style.top=y+'px';

    var a=Math.PI*2*i/12, r2=34+Math.random()*26;
    q.style.setProperty('--px',(Math.cos(a)*r2)+'px');

/* ---------- 音效 ---------- */
var ac=null;
function chime(soft){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended'){ ac.resume(); }
    if(soft){
      /* 順序連播：單音短促，避免 0.3s 間隔疊成噪音 */
      var so=ac.createOscillator(), sg=ac.createGain();
      so.type='sine'; so.frequency.value=880;
      var st=ac.currentTime;
      sg.gain.setValueAtTime(0,st); sg.gain.linearRampToValueAtTime(0.055,st+0.012);
      sg.gain.exponentialRampToValueAtTime(0.0001,st+0.3);
      so.connect(sg); sg.connect(ac.destination); so.start(st); so.stop(st+0.34);
      return;
    }
    [523.25,659.25,783.99].forEach(function(f,i){
      var o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=f;
      var t=ac.currentTime+i*0.07;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.09,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+1);
    });
  }catch(e){}
}

/* 名錄統一按 11 個大區順序羅列（組內按年代升序） */
var collapsedG = {}, stripLock = false;
function grpOf(p){ return G_MAP[p.area] || '其他'; }

function renderList(){
  var q=(document.getElementById('list-search').value||'').trim().toLowerCase();
  var groups={};
  GROUPS.forEach(function(g){ groups[g]=[]; });
  var extraG=[];
  var tot=0;
  POINTS.forEach(function(p){
    if(!visible(p)) return;
    if(q && (p.name+' '+p.place+' '+p.area+' '+grpOf(p)+' '+p.kind+' '+(p.lineage||'')+' '+(p.level||'')).toLowerCase().indexOf(q)<0) return;
    var _g=grpOf(p);
    if(!groups[_g]){ groups[_g]=[]; extraG.push(_g); }
    groups[_g].push(p); tot++;
  });
  var ORDER=GROUPS.concat(extraG);
  var h='';
  ORDER.forEach(function(g){
    var list=groups[g];
    if(!list.length) return;
    list.sort(function(a,b){
      var ya=(a.y===null?9999:a.y), yb=(b.y===null?9999:b.y);
      return ya-yb || (a.name<b.name?-1:1);
    });
    var c=G_COLOR[g]||'#94a3b8';
    var litN=list.filter(function(p){ return !!lit[p.idx]; }).length;
    h+='<div class="lg-group'+(collapsedG[g]?' collapsed':'')+'" data-g="'+g+'" id="grp-'+g+'">'
      +'<div class="lg-title" data-toggle-g="'+g+'"><i style="background:'+c+'"></i><span>'+g+'</span>'
      +'<span class="c">'+list.length+' 座'+(litN?(' · 已亮 '+litN):'')+'</span><span class="ar">▼</span></div>'
      +'<div class="lg-items">';
    list.forEach(function(p){
      h+='<div class="lg-item'+(lit[p.idx]?' lit':'')+((p.y===null)?' unknown':'')
        +'" data-i="'+p.idx+'" onclick="flyTo('+p.idx+')">'
        +'<span class="lg-y">'+((p.y===null)?'年代不詳':p.y)+'</span>'
        +(p.tier?('<span class="lg-star t'+p.tier+'" title="'+esc(TIER_LABEL[p.tier]||'')
          +'">'+(p.tier===1?'★':'☆')+'</span>'):'')
        +'<span class="lg-main"><span class="lg-n">'+esc(p.name)+'</span>'
        +'<span class="lg-p">'+esc(p.place)+'</span></span>'
        +'<span class="lg-t">'+esc(p.kind)+'</span></div>';
    });
    h+='</div></div>';
  });
  var body=document.getElementById('list-body');
  body.innerHTML = h || '<div style="padding:22px 16px;color:#8a9490;font-size:12.5px;line-height:1.8">'
    + '無匹配條目。<br>可清空搜索框，或檢查時間軸與地區／性質篩選。</div>';
  document.getElementById('list-count').textContent='共 '+tot+' 座（當前篩選）';
  renderStrip(groups);

function renderStrip(groups){
  var s=document.getElementById('list-strip'), h='';
  var ORDER2=GROUPS.concat(Object.keys(groups).filter(function(g){return GROUPS.indexOf(g)<0;}));
  ORDER2.forEach(function(g){
    var n=(groups[g]||[]).length, c=G_COLOR[g]||'#94a3b8';
    h+='<div class="strip-chip'+(n?'':' empty')+'" data-g="'+g+'"'
      +(n?(' onclick="jumpGroup(\''+g+'\')"'):'')
      +'><i style="background:'+c+'"></i>'+g+'<b>'+n+'</b></div>';
  });
  s.innerHTML=h;
  syncStrip();

function jumpGroup(g){
  var el=document.getElementById('grp-'+g), body=document.getElementById('list-body');
  if(!el||!body) return;
  if(collapsedG[g]){ collapsedG[g]=false; el.classList.remove('collapsed'); }
  stripLock=true;
  body.scrollTo({top:Math.max(0,el.offsetTop-2),behavior:'smooth'});
  setActiveGroup(g);
  setTimeout(function(){ stripLock=false; },700);
}
function setActiveGroup(g){
  var nodes=document.querySelectorAll('#list-strip .strip-chip');
  for(var k=0;k<nodes.length;k++){
    nodes[k].classList.toggle('active', nodes[k].getAttribute('data-g')===g);
  }
  var chip=document.querySelector('#list-strip .strip-chip[data-g="'+g+'"]');
  var strip=document.getElementById('list-strip');
  if(!chip||!strip) return;
  var l=chip.offsetLeft, r=l+chip.offsetWidth;
  if(l<strip.scrollLeft) strip.scrollTo({left:Math.max(0,l-16),behavior:'smooth'});
  else if(r>strip.scrollLeft+strip.clientWidth) strip.scrollTo({left:r-strip.clientWidth+16,behavior:'smooth'});
}
function syncStrip(){
  var body=document.getElementById('list-body');
  var gs=body.querySelectorAll('.lg-group');
  if(!gs.length) return;
  var top=body.scrollTop+8, cur=gs[0].getAttribute('data-g');
  for(var k=0;k<gs.length;k++){ if(gs[k].offsetTop<=top) cur=gs[k].getAttribute('data-g'); }
  setActiveGroup(cur);
}
(function(){
  var body=document.getElementById('list-body');
  body.addEventListener('scroll',function(){ if(!stripLock) syncStrip(); });
  body.addEventListener('click',function(e){
    var t=e.target.closest? e.target.closest('[data-toggle-g]'):null;
    if(!t) return;
    var g=t.getAttribute('data-toggle-g'), wrap=t.parentNode;
    if(wrap&&wrap.classList){ wrap.classList.toggle('collapsed'); collapsedG[g]=wrap.classList.contains('collapsed'); }
  },true);
  /* 滑條支持鼠標拖動與滾輪橫向滾動 */
  var s=document.getElementById('list-strip');
  var down=false, moved=false, sx=0, sl=0;
  s.addEventListener('mousedown',function(e){ down=true; moved=false; sx=e.clientX; sl=s.scrollLeft; s.classList.add('dragging'); });
  window.addEventListener('mousemove',function(e){
    if(!down) return;
    if(Math.abs(e.clientX-sx)>4) moved=true;
    s.scrollLeft=sl-(e.clientX-sx);
  });
  window.addEventListener('mouseup',function(){ if(down){ down=false; s.classList.remove('dragging'); } });
  s.addEventListener('click',function(e){ if(moved){ e.stopPropagation(); e.preventDefault(); } },true);
  s.addEventListener('wheel',function(e){
    if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ s.scrollLeft+=e.deltaY; e.preventDefault(); }
  },{passive:false});
})();
function flyTo(i){
  var p=POINTS[i];
  map.flyTo([p.lat,p.lon],Math.max(map.getZoom(),9),{duration:.9});
  setTimeout(function(){ openPopup(p); },900);
}
function fitAll(){ map.flyTo([22,80],2.3,{duration:.9}); }

/* ---------- 啓動 ---------- */
zoomStyle(); syncSecBtn(); refresh();
setTimeout(function(){ document.getElementById('tip').style.transition='opacity .8s'; document.getElementById('tip').style.opacity='0'; },7000);
</script>

<script id="mob-js">
(function(){
  var root = document.documentElement;
  var head = document.getElementById('header');
  var tp   = document.getElementById('time-panel');

  /* 依寬度或高度判斷小螢幕：橫屏 844x390 也算 */
  function isSmall(){ return window.innerWidth <= 760 || window.innerHeight <= 520; }
  function sync(){
    var hh = head ? head.offsetHeight : 0;
    var bt = tp ? tp.offsetHeight : 0;
    root.style.setProperty('--hh', hh + 'px');
    root.style.setProperty('--bt', bt + 'px');
    // 地圖容器避開頂欄與底欄，避免內容被壓在下面
    var m = document.getElementById('map');
    if(m && isSmall()){
      var pad = Math.round(hh + bt);
      L.DomUtil && map && map.invalidateSize && setTimeout(function(){ map.invalidateSize(); }, 60);
    }
  }
  sync();
  window.addEventListener('resize', sync);
  window.addEventListener('orientationchange', function(){ setTimeout(sync, 250); });
  window.addEventListener('load', sync);
  if(window.ResizeObserver){
    try{
      var ro = new ResizeObserver(sync);
      if(head) ro.observe(head);
      if(tp) ro.observe(tp);
    }catch(e){}
  }
  // 頂欄摺疊開關（僅手機）：點標題收起副標題與進度條，給地圖騰空間
  var h1 = head ? head.querySelector('h1') : null;
  if(h1){
    var fold = document.createElement('span');
    fold.className = 'fold';
    fold.textContent = '⌃';
    h1.appendChild(fold);
    h1.style.cursor = 'pointer';
    h1.title = '點擊收起／展開說明';
    h1.addEventListener('click', function(e){
      if(!isSmall()) return;
      e.stopPropagation();
      head.classList.toggle('mini');
      fold.textContent = head.classList.contains('mini') ? '⌄' : '⌃';
      setTimeout(sync, 60);
    });
  }
  // 首次在手機上打開時默認摺疊一半，讓地圖先露出來
  if(isSmall() && head){
    head.classList.add('mini');
    var f = head.querySelector('h1 .fold');
    if(f) f.textContent = '⌄';
    setTimeout(sync, 80);
  }
})();
</script>

<script id="ui-tweak-js">

<script id="sheet-js">
(function(){
  /* 依寬度或高度判斷小螢幕 */
  window.__isSmall = function(){
    return window.innerWidth <= 760 || window.innerHeight <= 520;
  };

  var sheet = document.getElementById('sheet');
  var scroll = document.getElementById('sheet-scroll');
  var titleEl = document.querySelector('#sheet-bar .st');
  var sheetP = null;

  window.showSheet = function(p){
    sheetP = p;
    titleEl.textContent = p.name;
    scroll.innerHTML = popupHTML(p);
    scroll.scrollTop = 0;
    sheet.classList.add('show');
    document.body.style.overflow = 'hidden';
    setTimeout(function(){ if(sheetP) syncLitBtn(sheetP); }, 30);
  };
  window.hideSheet = function(){
    sheet.classList.remove('show');
    document.body.style.overflow = '';
    sheetP = null;
  };
  document.getElementById('sheet-close').addEventListener('click', function(e){
    e.stopPropagation(); hideSheet();
  });
  /* 下滑關閉 */
  var sy0 = null;
  scroll.addEventListener('touchstart', function(e){ sy0 = e.touches[0].clientY; }, {passive:true});
  scroll.addEventListener('touchmove', function(e){
    if(sy0 === null) return;
    var dy = e.touches[0].clientY - sy0;
    if(dy > 90 && scroll.scrollTop <= 0){ hideSheet(); sy0 = null; }
  }, {passive:true});

  /* 小螢幕改為全屏卡片 */
  var _orig = window.openPopup;
  window.openPopup = function(p){
    if(window.__isSmall()){
      try{ map.closePopup(); }catch(e){}
      showSheet(p);
      return;
    }
    return _orig(p);
  };

  /* 旋屏／放大到桌面時關掉全屏卡片 */
  window.addEventListener('resize', function(){
    if(!window.__isSmall()){ hideSheet(); }
  });

  /* 提示條自動收起，騰出地圖空間 */
  var tip = document.getElementById('tip');
  if(tip){
    setTimeout(function(){ tip.classList.add('hide'); }, 6000);
    tip.addEventListener('click', function(){ tip.classList.add('hide'); });
  }
})();
</script>

<script id="ctrl2-js">
(function(){
